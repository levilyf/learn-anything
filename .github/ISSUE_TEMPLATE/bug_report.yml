name: Bug report
description: Report a reproducible problem in Learn Anything.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please avoid including private learner data, credentials, API keys, or other secrets."
  - type: input
    id: environment
    attributes:
      label: Agent and environment
      description: Which agent, model/provider, and version are you using?
      placeholder: Pi, version, model/provider
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redact all personal data and secrets.
    validations:
      required: false
