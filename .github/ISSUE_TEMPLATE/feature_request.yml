name: Feature request
description: Propose an improvement to the learning experience or project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Learner problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example
      description: Share a teaching scenario, user story, or evidence that motivates this.
    validations:
      required: false
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: What complexity, risks, or alternatives should be considered?
    validations:
      required: false
